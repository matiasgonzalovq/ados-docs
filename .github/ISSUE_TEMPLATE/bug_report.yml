name: Reporte de error
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¿Es un problema de seguridad? No lo reportes aquí: usa el canal privado
        descrito en [`SECURITY.md`](../../SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: ¿Qué ocurrió?
      description: Describe el error y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Versión o commit
      description: Rama o commit donde lo observaste.
  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - Navegador de escritorio
        - Navegador móvil
        - PWA instalada
        - Local con emuladores
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Capturas o mensajes de consola. No incluyas datos reales de clientes.
